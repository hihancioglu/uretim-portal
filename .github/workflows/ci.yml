name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: uretim_portal
          POSTGRES_USER: uretim_portal
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uretim_portal -d uretim_portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-for-production
      POSTGRES_DB: uretim_portal
      POSTGRES_USER: uretim_portal
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --requirement ../requirements.lock
      - name: Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply clean PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: pytest
      - name: Run legacy profiler tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest -p no:django tests/legacy_profiler
      - name: Build runtime image
        working-directory: ${{ github.workspace }}
        run: |
          docker build --target runtime --tag uretim-portal:ci .
          docker build --target static-server --tag uretim-portal-static:ci .
      - name: Verify production static and local PDF.js delivery
        working-directory: ${{ github.workspace }}
        run: |
          container="uretim-portal-static-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --add-host web:127.0.0.1 \
            --publish 127.0.0.1::80 uretim-portal-static:ci
          port="$(docker port "$container" 80/tcp | sed 's/.*://')"
          ready=0
          for attempt in $(seq 1 20); do
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              echo "Static-server container exited during startup"
              docker logs "$container"
              exit 1
            fi
            if curl --fail --silent \
              "http://127.0.0.1:${port}/static/drawings/viewer.css" >/dev/null
            then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != "1" ]; then
            echo "Static-server did not become ready"
            docker logs "$container"
            exit 1
          fi
          if docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' \
            "$container" | grep -Fxq /data/drawings
          then
            echo "Private drawing storage must not be mounted in static-server"
            exit 1
          fi
          for asset in \
            drawings/viewer.css \
            drawings/manage.css \
            drawings/viewer.js \
            control_points/control_points.css \
            control_points/control_points.js \
            inspections/inspection.css \
            inspections/inspection.js \
            inspections/inspection_overlay.js \
            inspections/inspection_overlay.css \
            vendor/pdfjs/6.2.108/pdf.mjs \
            vendor/pdfjs/6.2.108/pdf.worker.mjs \
            vendor/pdfjs/6.2.108/LICENSE
          do
            headers="/tmp/$(basename "$asset").headers"
            output="/tmp/$(basename "$asset")"
            if ! status="$(curl --silent --show-error --dump-header "$headers" --write-out '%{http_code}' \
              --output "$output" "http://127.0.0.1:${port}/static/${asset}")"
            then
              echo "asset=$asset curl_failed=true"
              cat "$headers" 2>/dev/null || true
              docker logs "$container"
              exit 1
            fi
            content_type="$(awk 'tolower($1) == "content-type:" { $1=""; sub(/^ /, ""); sub(/\r$/, ""); print; exit }' "$headers")"
            echo "asset=$asset status=$status content-type=${content_type:-<missing>}"
            if [ "$status" != "200" ] || [ ! -s "$output" ]; then
              echo "Static asset failed HTTP 200/non-empty validation: $asset"
              cat "$headers"
              docker logs "$container"
              exit 1
            fi
            if [[ "$asset" == *.js || "$asset" == *.mjs ]]; then
              if ! grep -Eiq '^content-type: (text|application)/javascript' "$headers"; then
                echo "Static module has an incompatible Content-Type: asset=$asset content-type=${content_type:-<missing>}"
                cat "$headers"
                docker logs "$container"
                exit 1
              fi
            fi
            if [[ "$asset" == *.css ]]; then
              if ! grep -Eiq '^content-type: text/css' "$headers"; then
                echo "Stylesheet has an incompatible Content-Type: asset=$asset content-type=${content_type:-<missing>}"
                cat "$headers"
                docker logs "$container"
                exit 1
              fi
            fi
          done
      - name: Verify private volume is writable as runtime user
        working-directory: ${{ github.workspace }}
        run: |
          volume="uretim-portal-drawings-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm --force "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume"
          docker run --rm --volume "$volume:/data/drawings" uretim-portal:ci \
            python -c 'import os, pathlib; assert os.geteuid() != 0; p = pathlib.Path("/data/drawings/.ci-storage-smoke"); p.write_bytes(b"private-storage-smoke"); assert p.read_bytes() == b"private-storage-smoke"; p.unlink()'
