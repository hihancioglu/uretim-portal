name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: uretim_portal
          POSTGRES_USER: uretim_portal
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uretim_portal -d uretim_portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.2.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-for-production
      POSTGRES_DB: uretim_portal
      POSTGRES_USER: uretim_portal
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --requirement ../requirements.lock
      - name: Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply clean PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: pytest
      - name: Run legacy profiler tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest -p no:django tests/legacy_profiler
      - name: Build runtime image
        working-directory: ${{ github.workspace }}
        run: |
          docker build --target runtime --tag uretim-portal:ci .
          docker build --target static-server --tag uretim-portal-static:ci .
      - name: Verify production static and local PDF.js delivery
        working-directory: ${{ github.workspace }}
        run: |
          container="uretim-portal-static-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --publish 127.0.0.1::80 uretim-portal-static:ci
          port="$(docker port "$container" 80/tcp | sed 's/.*://')"
          for asset in \
            drawings/viewer.css \
            vendor/pdfjs/2.14.305/pdf.min.js \
            vendor/pdfjs/2.14.305/pdf.worker.min.js
          do
            curl --fail --silent --show-error --retry 10 --retry-connrefused \
              --output "/tmp/$(basename "$asset")" "http://127.0.0.1:${port}/static/${asset}"
            test -s "/tmp/$(basename "$asset")"
          done
      - name: Verify private volume is writable as runtime user
        working-directory: ${{ github.workspace }}
        run: |
          volume="uretim-portal-drawings-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm --force "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume"
          docker run --rm --volume "$volume:/data/drawings" uretim-portal:ci \
            python -c 'import os, pathlib; assert os.geteuid() != 0; p = pathlib.Path("/data/drawings/.ci-storage-smoke"); p.write_bytes(b"private-storage-smoke"); assert p.read_bytes() == b"private-storage-smoke"; p.unlink()'
