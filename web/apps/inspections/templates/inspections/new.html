{% extends 'inspections/base.html' %}{% block content %}<h1>Yeni Kontrol</h1><form method="get" class="filters"><input name="q" value="{{ request.GET.q }}" placeholder="TR kodu, ürün veya plastik kodu"><button>Ara</button></form><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label>Aktif Teknik Resim<select name="drawing_revision" required>{% for r in revisions %}<option value="{{ r.id }}">{{ r.drawing.product.tr_code }} — {{ r.drawing.product.product_name }} / {{ r.revision_code }} ({{ r.drawing.get_scope_display }})</option>{% endfor %}</select></label><label>Lot / İş Emri<input name="lot_no" maxlength="120"></label><label>Serial<input name="serial_no" maxlength="120"></label><label>Göz Adedi<input type="number" name="declared_eye_count" value="1" min="1" required></label><button>Kontrolü Başlat</button></form>{% endblock %}
