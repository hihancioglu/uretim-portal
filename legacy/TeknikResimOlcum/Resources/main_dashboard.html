<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A Blok Kalite Kontrol Süreçleri</title>
  <style>
    :root{
      --navy:#092b59;--navy-2:#10447d;--blue:#246be8;--ink:#0d2748;--muted:#6f829e;
      --line:#dbe5f0;--surface:#fff;--bg:#f3f7fb;--shadow:0 12px 34px rgba(31,60,92,.08);
      --red:#e84a5f;--orange:#f59b2a;--purple:#805ad5;--green:#24b47e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
    button{font:inherit}
    .app{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#06244e 0%,#0b3d78 100%);color:#fff;padding:25px 18px 20px;box-shadow:12px 0 32px rgba(20,51,88,.13);z-index:2}
    .brand{display:flex;align-items:center;gap:13px;padding:0 4px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
    .brand-mark{display:grid;place-items:center;width:66px;height:66px;flex:0 0 66px;background:transparent;overflow:visible}
    .brand-mark img{display:block;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 9px 15px rgba(0,0,0,.22))}
    .brand-title{font-size:18px;font-weight:850;line-height:1.15;white-space:nowrap}.brand-sub{margin-top:4px;font-size:13px;font-weight:700;line-height:1.2;color:#d8e7fb;white-space:nowrap}
    .user-card{margin-top:16px;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(255,255,255,.075)}
    .user-name{font-weight:800;font-size:14px}.user-meta{margin-top:5px;color:#bdd0e8;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
    .side-label{margin:22px 10px 9px;color:#88a8d0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .side-nav{display:grid;gap:6px}
    .side-nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:11px;padding:11px 12px;background:transparent;color:#d8e5f5;text-align:left;font-size:12px;font-weight:700;cursor:pointer}
    .side-nav button:hover,.side-nav button.active{background:linear-gradient(90deg,#2b72ec,#2364d7);color:#fff;box-shadow:0 7px 16px rgba(0,0,0,.13)}
    .side-dot{width:8px;height:8px;border-radius:50%;background:#78a8e4;flex:0 0 auto}.side-nav button.active .side-dot{background:#fff}
    .side-name{min-width:0;flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-count{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:22px;margin-left:auto;padding:0 7px;border-radius:999px;background:#e3314d;color:#fff;font-size:10px;font-weight:900;box-shadow:0 4px 10px rgba(180,25,49,.28);white-space:nowrap}
    .session-actions{display:grid;gap:7px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
    .session-actions button{border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.06);color:#eef5ff;padding:10px 12px;font-size:11px;font-weight:700;cursor:pointer;text-align:left}
    .session-actions button:hover{background:rgba(255,255,255,.13)}
    .content{min-width:0;padding:27px 30px 34px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:19px}
    .page-title h1{margin:0;font-size:25px;letter-spacing:-.03em}.page-title p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .side-status{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 13px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.075);font-size:10.5px;color:#cfe0f3;white-space:nowrap}
    .online{width:9px;height:9px;border-radius:50%;background:#26bd7f;box-shadow:0 0 0 4px #e1f7ef}
    .notice{display:none;margin:0 0 16px;padding:12px 15px;border:1px solid #f3cf82;border-radius:12px;background:#fff8e8;color:#815514;font-size:12px;font-weight:700}
    .notice.show{display:block}.notice.test{border-color:#e2c46d;background:#fff7d6}.notice.update{border-color:#f0b1b8;background:#fff0f2;color:#a3293a}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:16px;margin-bottom:19px}
    .kpi{position:relative;isolation:isolate;overflow:hidden;min-height:154px;padding:19px 20px 16px;border:1px solid #d7e3ef;border-radius:20px;background:linear-gradient(145deg,#fff 0%,#fff 68%,var(--soft) 150%);box-shadow:0 10px 28px rgba(31,60,92,.075);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .kpi:hover{transform:translateY(-2px);border-color:#b9cde2;box-shadow:0 15px 34px rgba(31,60,92,.12)}
    .kpi::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),transparent 82%)}
    .kpi::after{content:"";position:absolute;z-index:-1;right:-42px;top:-48px;width:120px;height:120px;border:18px solid var(--soft);border-radius:50%;opacity:.75}
    .kpi-head{display:flex;align-items:center;min-height:23px}.kpi-label{min-width:0;color:#435b78;font-size:11.5px;font-weight:800;line-height:1.3}
    .kpi-value{position:relative;z-index:1;margin-top:13px;color:#08284f;font-size:33px;font-weight:850;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
    .kpi-note{position:relative;z-index:1;display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid #e9eff5;color:#7588a2;font-size:10.5px;line-height:1.3}.kpi-note::before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
    .main-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:16px;margin-bottom:17px}
    .panel{min-width:0;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);padding:18px}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:14px}.panel-title{font-size:15px;font-weight:800}.panel-sub{margin-top:4px;color:var(--muted);font-size:10px}
    .overview{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;gap:24px;min-height:225px}
    .ring{--value:0;display:grid;place-items:center;width:160px;height:160px;margin:auto;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--value)*1%),#e8eef5 0);position:relative}
    .ring::before{content:"";position:absolute;inset:23px;border-radius:50%;background:#fff}.ring-center{position:relative;text-align:center}.ring-value{font-size:29px;font-weight:800}.ring-label{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}
    .metric-list{display:grid;gap:10px}.metric-row{display:grid;grid-template-columns:11px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf2f7;font-size:11px}.metric-row:last-child{border-bottom:0}.metric-dot{width:9px;height:9px;border-radius:50%}.metric-value{font-weight:800}
    .attention-list{display:grid;gap:9px}.attention{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #e4ebf3;border-radius:13px;background:#fbfdff;cursor:pointer}.attention:hover{border-color:#b7d0f2;background:#f5f9ff}.attention-icon{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:#edf4ff;color:#2364d7;font-size:11px;font-weight:900}.attention-copy{min-width:0;flex:1}.attention-title{font-size:11px;font-weight:800}.attention-sub{margin-top:3px;color:var(--muted);font-size:9.5px}.badge{padding:5px 8px;border-radius:999px;background:#fff0f2;color:#c91f3b;font-size:9px;font-weight:800;white-space:nowrap}.badge.neutral{background:#edf4ff;color:#2364d7}
    #sections{display:grid;gap:16px}
    .section{scroll-margin-top:18px;margin:0;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:0 2px 14px;padding-bottom:12px;border-bottom:1px solid #e8eef5}
    .section-title{font-size:16px;font-weight:800}.section-count{color:var(--muted);font-size:10px}
    .action-grid{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:12px}
    .action{display:flex;align-items:center;gap:12px;min-width:0;min-height:66px;padding:16px 18px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 7px 18px rgba(34,65,98,.045);cursor:pointer;text-align:left;color:var(--ink)}
    .action:hover{transform:translateY(-1px);border-color:#9dc0ef;box-shadow:0 11px 23px rgba(34,65,98,.09)}
    .action.primary{border-color:#b7d1f4;background:linear-gradient(145deg,#f5f9ff,#fff)}
    .action.alert{border-color:#d92f47;background:linear-gradient(135deg,#e8455b,#cf263f);color:#fff;box-shadow:0 9px 21px rgba(207,38,63,.2)}
    .action.alert:hover{border-color:#bd2037;background:linear-gradient(135deg,#dc374f,#bd2037);box-shadow:0 12px 25px rgba(190,32,55,.28)}
    .action.alert .action-icon{background:rgba(255,255,255,.17);color:#fff}
    .action.alert .action-arrow{color:#fff}
    .action.alert .action-badge{background:#fff;color:#bd2037}
    .action-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:var(--soft,#edf4ff);color:var(--accent,#2364d7);font-size:11px;font-weight:900}
    .action-copy{display:block;min-width:0;flex:1}.action-title{display:block;font-size:14px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}.action-arrow{flex:0 0 auto;color:#9aa9ba;font-size:19px}.action-badge{display:inline-block;flex:0 0 auto;margin:0 10px 0 20px;padding:5px 9px;border-radius:999px;background:#fff0f2;color:#c91f3b;font-size:10.5px;font-weight:800;white-space:nowrap}
    .empty{padding:25px;border:1px dashed #cbd8e6;border-radius:14px;color:var(--muted);text-align:center;font-size:11px}
    @media(max-width:1250px){.action-grid{grid-template-columns:repeat(2,minmax(200px,1fr))}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:900px){.app{grid-template-columns:300px minmax(0,1fr)}.sidebar{padding-left:12px;padding-right:12px}.content{padding:20px 18px}.main-grid{grid-template-columns:1fr}.overview{grid-template-columns:160px 1fr}.action-grid{grid-template-columns:1fr}.section{padding:14px}}
    @media(max-width:700px){.app{display:block}.sidebar{position:relative;width:100%;height:auto}.side-nav{grid-template-columns:repeat(2,1fr)}.content{padding:16px}.kpis{grid-template-columns:1fr}.overview{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"><img src="app_icon.png" alt="A Blok Kalite Kontrol Süreçleri"></div><div><div class="brand-title">A Blok</div><div class="brand-sub">Kalite Kontrol Süreçleri</div></div></div>
      <div class="user-card"><div id="userName" class="user-name">Kullanıcı</div><div id="userMeta" class="user-meta">Rol bilgisi yükleniyor…</div></div>
      <div class="side-status"><span class="online"></span><span id="statusText">Sistem hazır</span></div>
      <div class="side-label">Çalışma Alanları</div><nav id="sideNav" class="side-nav"></nav>
      <div class="session-actions">
        <button data-command="change-password">Şifremi Değiştir</button>
        <button data-command="switch-user">Kullanıcı Değiştir</button>
        <button data-command="exit">Programdan Çık</button>
      </div>
    </aside>
    <main class="content">
      <div id="notice" class="notice"></div>
      <section id="kpis" class="kpis"></section>
      <div id="sections"></div>
    </main>
  </div>
  <script>
    const state={user:{name:'Kullanıcı',role:''},kpis:[],groups:[],isPermissionTest:false,updateStatus:'',generatedAt:''};
    const colors=['#e84a5f','#f59b2a','#805ad5','#24b47e'];
    const soft=['#fff0f2','#fff4e8','#f2ecff','#eafaf4'];
    const el=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    function send(command){if(!command)return;if(window.chrome?.webview)window.chrome.webview.postMessage({type:'main-command',command});}
    document.addEventListener('click',event=>{const target=event.target.closest('[data-command]');if(target)send(target.dataset.command);});
    function render(){
      el('userName').textContent=state.user?.name||'Kullanıcı';
      el('userMeta').textContent=state.user?.role||'';
      el('statusText').textContent=state.generatedAt?`Güncellendi: ${state.generatedAt}`:'Sistem hazır';
      renderNotice();renderKpis();renderGroups();
    }
    function renderNotice(){const box=el('notice');box.className='notice';box.textContent='';if(state.updateStatus){box.textContent=state.updateStatus;box.classList.add('show','update')}else if(state.isPermissionTest){box.textContent='Yetki test hesabı kullanılıyor. Menü yalnızca bu hesaba tanımlanan yetkileri gösterir.';box.classList.add('show','test')}}
    function renderKpis(){el('kpis').innerHTML=(state.kpis||[]).map((k,i)=>{const value=typeof k.value==='number'?k.value.toLocaleString('tr-TR'):String(k.value??0);return `<article class="kpi" style="--accent:${colors[i%colors.length]};--soft:${soft[i%soft.length]}"><div class="kpi-head"><div class="kpi-label">${esc(k.label)}</div></div><div class="kpi-value">${esc(value)}</div><div class="kpi-note">${esc(k.note||'Aktif kayıt')}</div></article>`}).join('')}
    function renderGroups(){
      const groups=state.groups||[];
      el('sideNav').innerHTML=groups.map((g,i)=>`<button class="${i===0?'active':''}" data-section="section-${i}"><span class="side-dot"></span><span class="side-name">${esc(g.title)}</span>${Number(g.alertCount)>0?`<span class="side-count">${Number(g.alertCount).toLocaleString('tr-TR')}</span>`:''}</button>`).join('');
      el('sections').innerHTML=groups.map((g,i)=>`<section id="section-${i}" class="section"><div class="section-head"><div class="section-title">${esc(g.title)}</div><div class="section-count">${g.items.length} işlem</div></div><div class="action-grid">${g.items.map(item=>`<button class="action ${item.primary?'primary':''} ${item.badge?'alert':''}" data-command="${esc(item.command)}"><span class="action-copy"><span class="action-title">${esc(item.title)}</span></span>${item.badge?`<span class="action-badge">${esc(item.badge)}</span>`:''}<span class="action-arrow">›</span></button>`).join('')}</div></section>`).join('');
      document.querySelectorAll('[data-section]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-section]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'})}));
    }
    if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>{if(event.data?.type!=='main-dashboard-data')return;Object.assign(state,event.data);render()});
    render();
  </script>
</body>
</html>
